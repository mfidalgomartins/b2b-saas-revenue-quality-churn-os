name: QA Validation Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Static type check (mypy)
        run: python -m mypy

      - name: Static security scan (bandit)
        run: python -m bandit -c pyproject.toml -r src scripts -q

      - name: Dependency vulnerability audit (pip-audit)
        run: python -m pip_audit --skip-editable --progress-spinner off

      - name: Build end-to-end pipeline
        run: python src/pipeline/run_project_pipeline.py --base-dir . --seed 42

      - name: Run tests with coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report

      - name: Enforce validation gate
        run: |
          python src/validation/check_validation_gate.py \
            --summary-path reports/formal_validation_summary.json \
            --max-warn 0 \
            --max-fail 0 \
            --max-high-severity 0 \
            --max-critical-severity 0 \
            --min-readiness-tier "technically valid"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            reports/formal_validation_findings.csv
            reports/formal_validation_summary.json
