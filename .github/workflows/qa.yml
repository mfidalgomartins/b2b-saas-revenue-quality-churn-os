name: QA Validation Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["*"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Static type check (mypy)
        run: python -m mypy

      - name: Static security scan (bandit)
        run: python -m bandit -c pyproject.toml -r src scripts -q

      - name: Dependency vulnerability audit (pip-audit)
        run: python -m pip_audit --skip-editable --progress-spinner off

      - name: Build end-to-end pipeline
        run: python -m src.pipeline.run_project_pipeline --base-dir . --seed 42

      - name: Verify PDF report artifact
        run: |
          f=outputs/reports/revenue_quality_os_analytical_report.pdf
          test -s "$f"
          first_hash=$(sha256sum "$f" | cut -d' ' -f1)
          python scripts/build_pdf_report.py
          second_hash=$(sha256sum "$f" | cut -d' ' -f1)
          if [ "$first_hash" != "$second_hash" ]; then
            echo "PDF report build is not byte-reproducible" >&2
            exit 1
          fi
          size=$(stat -c%s "$f")
          echo "Report size: ${size} bytes"
          if [ "$size" -lt 500000 ]; then
            echo "PDF report is suspiciously small (<500KB) — possible silent truncation" >&2
            exit 1
          fi

      - name: Run tests with coverage gate
        run: |
          python -m coverage run -m unittest discover -s tests -p 'test_*.py'
          python -m coverage report

      - name: Enforce validation gate
        run: |
          python -m src.validation.check_validation_gate \
            --summary-path reports/formal_validation_summary.json \
            --max-warn 0 \
            --max-fail 0 \
            --max-high-severity 0 \
            --max-critical-severity 0 \
            --min-readiness-tier "technically valid"

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-artifacts
          path: |
            reports/formal_validation_findings.csv
            reports/formal_validation_summary.json

  container:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned release image
        run: docker build --tag revenue-quality-os:ci .

      - name: Smoke-test installed package as non-root user
        run: |
          uid=$(docker run --rm revenue-quality-os:ci id -u)
          test "$uid" = "10001"
          docker run --rm revenue-quality-os:ci python -c "import src; import pandas; import duckdb"
